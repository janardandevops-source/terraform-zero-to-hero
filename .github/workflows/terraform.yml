name: Terraform CI

on:
  pull_request:
    paths:
      - "Terraform Project/**"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "Terraform Project/environments/Dev"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::816740068799:role/GitHubActions-Terraform
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify Secrets Manager access
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id terraform-production-project/dev/demo-secret \
            --query SecretString \
            --output text)

          echo "::add-mask::$SECRET"
          echo "Successfully retrieved secret from AWS Secrets Manager"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan